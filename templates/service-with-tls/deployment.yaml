apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: myapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64        # pin to the ARM main node (also required if you mount local-path storage)
      containers:
        - name: myapp
          image: traefik/whoami          # <- replace with your image; pin a specific tag, avoid :latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          # --- Persistence (uncomment + add pvc.yaml to kustomization) ---
          # volumeMounts:
          #   - name: data
          #     mountPath: /data
      # volumes:
      #   - name: data
      #     persistentVolumeClaim:
      #       claimName: myapp-data
