# Nightly backup of supabase state (Postgres cluster + storage uploads) to Cloudflare R2.
#
# NOT part of the Helm chart — applied by `make supabase` before the helm upgrade.
# Two stages share an emptyDir:
#   1. init "dump":    pg_dumpall over the cluster network (supabase-supabase-db:5432,
#                      -U postgres — all roles + databases incl. the _supabase
#                      analytics DB, same as the README's manual command), gzipped.
#   2. main "upload":  tars the storage-uploads PVC (mounted read-only; same-node RWO
#                      multi-attach is fine on local-path), rclone-copies both files
#                      to r2:<bucket>/backups/supabase/, prunes copies older than 30d.
#
# R2 credentials come from the `backup-r2` Secret (scripts/apply-secrets.sh, from
# BACKUP_R2_* in .env): its RCLONE_CONFIG_R2_* keys form a config-less rclone "r2"
# remote via envFrom; the non-secret TYPE/PROVIDER pair is set here.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: supabase-backup
  namespace: supabase
spec:
  schedule: "50 3 * * *"            # staggered: wallos 03:10, multica 03:30, supabase 03:50
  timeZone: Asia/Shanghai
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: supabase-backup
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: arm64    # storage PV lives on ARM (its node affinity forces this anyway)
          initContainers:
            - name: dump
              image: postgres:17-alpine  # pg_dumpall 17 client; server is supabase postgres 15.x
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  set -o pipefail    # a failed pg_dumpall must fail the Job, not hide behind gzip's exit 0
                  pg_dumpall -h supabase-supabase-db -U postgres | gzip > "/backup/supabase-db-$(date +%F).sql.gz"
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: supabase-db
                      key: password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
          containers:
            - name: upload
              image: rclone/rclone:1.74.3
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  ts="$(date +%F)"
                  tar czf "/backup/supabase-storage-${ts}.tgz" -C /data storage
                  rclone copy /backup "r2:${BACKUP_BUCKET}/backups/supabase/"
                  rclone delete "r2:${BACKUP_BUCKET}/backups/supabase/" --min-age 30d
                  echo "--- backups now in r2:${BACKUP_BUCKET}/backups/supabase/ ---"
                  rclone lsl "r2:${BACKUP_BUCKET}/backups/supabase/"
              env:
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_NO_CHECK_BUCKET
                  value: "true"      # bucket-scoped R2 tokens may not HeadBucket/CreateBucket
              envFrom:
                - secretRef:
                    name: backup-r2
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: backup
                  mountPath: /backup
                - name: storage
                  mountPath: /data/storage
                  readOnly: true
          volumes:
            - name: backup
              emptyDir: {}
            - name: storage
              persistentVolumeClaim:
                claimName: supabase-storage
                readOnly: true
