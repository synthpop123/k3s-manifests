# Supabase self-host values for the lkwplus.com k3s cluster.
#
# Deploy:  make secrets    # create the 8 supabase-* Secrets from secrets.enc.env (run first)
#          make supabase   # `helm upgrade --install` with this file
#
# Upstream chart: supabase/supabase (https://supabase-community.github.io/supabase-kubernetes),
# version pinned in the Makefile as SUPABASE_CHART_VERSION. The chart pins every component
# image tag internally, so an upgrade is just a chart bump. This file overrides ONLY what
# differs from the chart defaults; see the full surface with:
#   helm show values supabase/supabase --version <v>

# --- Secrets ---------------------------------------------------------------------------------
# Every credential is created out-of-band by scripts/apply-secrets.sh from secrets.enc.env and referenced
# here by name, so nothing sensitive is ever templated into git. Each Secret uses the chart's
# natural key names, so no secretRefKey remapping is needed.
#
# `apikey` is deliberately left at the chart default (empty): that keeps the classic symmetric
# JWT model (anon/service keys), and the chart's kong-entrypoint drops the empty credentials.
secret:
  jwt:
    secretRef: supabase-jwt
  db:
    # Non-secret DB name; the chart hands it to services as a literal and the supabase-db
    # Secret also carries it (the StatefulSet reads `database` from the Secret directly).
    database: postgres
    secretRef: supabase-db
  dashboard:
    secretRef: supabase-dashboard
  analytics:
    secretRef: supabase-analytics
  realtime:
    secretRef: supabase-realtime
  meta:
    secretRef: supabase-meta
  s3:
    secretRef: supabase-s3
  smtp:
    secretRef: supabase-smtp

# --- Placement + resources -------------------------------------------------------------------
# Pin the whole stack to the ARM control-plane node. It's the only large node (4 CPU / 24Gi vs
# ~1Gi on the amd/sg agents), and the db + storage PVCs use node-local `local-path` storage, so
# the stateful pods must live where their data binds. Requests only (no memory limits) — the
# BEAM/JVM-ish services (analytics, realtime) baloon under load and tight limits would OOMKill.
deployment:
  analytics:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 100m, memory: 256Mi } }
  auth:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  db:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 100m, memory: 256Mi } }
  functions:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  imgproxy:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 25m, memory: 64Mi } }
  kong:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 256Mi } }
  meta:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 25m, memory: 128Mi } }
  realtime:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 100m, memory: 256Mi } }
  rest:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  storage:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 128Mi } }
  studio:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 256Mi } }
  vector:
    nodeSelector: { kubernetes.io/arch: arm64 }
    resources: { requests: { cpu: 50m, memory: 128Mi } }

# --- Persistence -----------------------------------------------------------------------------
# local-path is the cluster default StorageClass; set it explicitly to make the node-local
# coupling obvious. File storage backend (MinIO disabled), so uploads land on the storage PVC.
persistence:
  db:
    storageClassName: local-path
    size: 10Gi
  storage:
    storageClassName: local-path
    size: 5Gi

# --- Public URLs + auth behaviour ------------------------------------------------------------
# Maps deep-merge with the chart defaults, so only the changed keys are listed here.
environment:
  auth:
    # The public origin Kong is reached at; GoTrue builds email links + redirects from these.
    API_EXTERNAL_URL: https://supabase.lkwplus.com
    GOTRUE_SITE_URL: https://supabase.lkwplus.com
    # Public self-service signup is OFF — create users from Studio or with the service key.
    GOTRUE_DISABLE_SIGNUP: "true"
    # Real SMTP is wired below, so don't silently auto-confirm: send the confirmation email.
    GOTRUE_MAILER_AUTOCONFIRM: "false"
    GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
    # Resend SMTP (https://resend.com). User/pass come from the supabase-smtp Secret
    # (username "resend", password = Resend API key). Sender domain must be verified in Resend.
    GOTRUE_SMTP_ADMIN_EMAIL: supabase@lkwplus.com
    GOTRUE_SMTP_HOST: smtp.resend.com
    GOTRUE_SMTP_PORT: "465"
    GOTRUE_SMTP_SENDER_NAME: Supabase
  studio:
    # Studio builds the API snippets/links shown in the dashboard from this.
    SUPABASE_PUBLIC_URL: https://supabase.lkwplus.com

# --- Ingress ---------------------------------------------------------------------------------
# Single Traefik Ingress -> Kong (the API gateway / only public entrypoint). cert-manager's
# ingress-shim issues the Let's Encrypt cert from the letsencrypt-cf ClusterIssuer (Cloudflare
# DNS-01). The chart defaults target nginx, so override className and null out the nginx-only
# rewrite-target annotation.
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cf
    nginx.ingress.kubernetes.io/rewrite-target: null
  tls:
    - hosts:
        - supabase.lkwplus.com
      secretName: supabase-tls
  hosts:
    - host: supabase.lkwplus.com
      paths:
        - path: /
          pathType: Prefix
