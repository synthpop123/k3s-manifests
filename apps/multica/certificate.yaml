# One TLS cert covering both multica hosts, issued by cert-manager through the
# letsencrypt-cf ClusterIssuer (Cloudflare DNS-01 — so it issues even before the
# api.multica CNAME exists). The Helm chart's ingress.tls references this secret on
# both the frontend and backend Ingress (see values.yaml), which is why we mint it
# explicitly here instead of via the ingress-shim annotation.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: multica-tls
  namespace: multica
spec:
  secretName: multica-tls
  issuerRef:
    name: letsencrypt-cf
    kind: ClusterIssuer
  dnsNames:
    - multica.lkwplus.com
    - api.multica.lkwplus.com
