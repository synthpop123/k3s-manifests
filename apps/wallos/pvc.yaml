apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallos-db
  namespace: wallos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path        # node-local storage -> pod must stay on ARM (see nodeSelector)
  resources:
    requests:
      storage: 1Gi                    # holds the SQLite database; tiny, but give it room
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wallos-logos
  namespace: wallos
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi                    # uploaded subscription logos
