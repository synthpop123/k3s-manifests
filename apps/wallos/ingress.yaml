apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wallos
  namespace: wallos
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cf   # auto-issues a Let's Encrypt cert
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - wallos.lkwplus.com
      secretName: wallos-tls
  rules:
    - host: wallos.lkwplus.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wallos
                port:
                  number: 80
