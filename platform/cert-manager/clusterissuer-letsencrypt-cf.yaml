# Cluster-wide Let's Encrypt issuer using Cloudflare DNS-01 challenge.
# Requires the Secret `cloudflare-api-token` in namespace cert-manager
# (see cloudflare-api-token.secret.example.yaml).
# Apply: kubectl apply -f clusterissuer-letsencrypt-cf.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-cf
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: lkw20010211@gmail.com
    privateKeySecretRef:
      name: letsencrypt-cf-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
